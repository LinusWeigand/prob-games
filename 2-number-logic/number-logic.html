<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Logic</title>
<style>
  :root{
    --ink:        #1b1b1f;
    --ink-soft:   #4a4a52;
    --ink-faint:  #8b8b93;
    --line:       #e4e4e8;
    --cell:       #f7f8f9;
    --cell-hover: #eceef0;
    --magenta:    #b3117e;
    --magenta-dk: #8e0d64;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    background:#fff;
    color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---------------------------------------------------------------- start */

  #start{
    min-height:100vh;
    display:none;
    flex-direction:column;
    justify-content:center;
    padding:0 0 60px;
  }
  #start.active{ display:flex; }

  .start-inner{ padding:0 7vw; }

  .brand{
    font-size:13px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--magenta);
    font-weight:600;
    margin-bottom:14px;
  }
  h1{
    margin:0 0 14px;
    font-size:44px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .lede{
    margin:0 0 40px;
    font-size:16px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:640px;
  }
  .lede b{ font-weight:600; color:var(--ink); }

  .modes{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
    max-width:720px;
  }
  .mode{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--cell);
    padding:30px 28px 32px;
    text-align:left;
    font:inherit;
    color:inherit;
    cursor:pointer;
    transition:background .12s ease;
  }
  .mode:hover{ background:var(--cell-hover); }
  .mode-title{ font-size:20px; font-weight:600; margin-bottom:8px; }
  .mode-sub{ font-size:14px; line-height:1.55; color:var(--ink-soft); }

  .dbline{
    margin-top:26px;
    font-size:13px;
    color:var(--ink-faint);
  }

  /* ----------------------------------------------------------------- quiz */

  #quiz{ min-height:100vh; display:none; flex-direction:column; }
  #quiz.active{ display:flex; }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:22px 26px 0;
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .counter{ color:var(--ink); font-weight:400; }
  .timer.low{ color:var(--magenta); font-weight:600; }

  .stem{
    padding:52px 7vw 0;
    flex:1 0 auto;
  }

  /* sequence row */
  .seq-row{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:10px 6px;
    margin:0;
  }
  .seq-term{
    font-size:32px;
    font-weight:600;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .seq-sep{
    font-size:22px;
    color:var(--ink-faint);
    font-weight:300;
    user-select:none;
  }
  .seq-blank{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:56px;
    height:48px;
    border:2px dashed var(--magenta);
    border-radius:6px;
    font-size:28px;
    font-weight:700;
    color:var(--magenta);
  }

  .hint{
    margin:30px 0 0;
    font-size:15px;
    font-weight:400;
    color:var(--ink-soft);
  }

  .grid{
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    border-top:1px solid var(--line);
  }
  .opt{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--cell);
    min-height:84px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px 22px;
    text-align:center;
    font:inherit;
    font-size:17px;
    color:var(--ink);
    cursor:pointer;
    transition:background .1s ease, box-shadow .1s ease;
  }
  .opt:nth-child(3n+1){ border-left:1px solid var(--line); }
  .opt:hover{ background:var(--cell-hover); }
  .opt.selected{
    background:#fff;
    box-shadow:inset 0 0 0 2px var(--magenta);
    font-weight:600;
  }
  .opt.skip{ color:var(--ink-faint); }

  .opt.correct-highlight{
    background:#e6f5ed;
    box-shadow:inset 0 0 0 2px #1a7f4b;
    font-weight:600;
  }
  .opt.wrong-highlight{
    background:#fce8e8;
    box-shadow:inset 0 0 0 2px var(--magenta);
    font-weight:600;
  }
  .opt.locked{
    pointer-events:none;
    opacity:.7;
  }

  .actions{
    display:flex;
    justify-content:flex-end;
    padding:18px 26px 30px;
  }
  .submit{
    background:var(--magenta);
    color:#fff;
    border:0;
    border-radius:3px;
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:9px 20px;
    cursor:pointer;
    transition:background .12s ease, opacity .12s ease;
  }
  .submit:hover{ background:var(--magenta-dk); }
  .submit:disabled{ opacity:.4; cursor:not-allowed; }

  /* breakdown card */
  .breakdown-body{ padding:0 7vw; }

  .breakdown{ display:none; }
  .breakdown.visible{ display:block; }

  .verdict{
    font-size:20px;
    font-weight:700;
    padding:18px 0 14px;
  }
  .verdict.ok{ color:#1a7f4b; }
  .verdict.no{ color:var(--magenta); }

  .card{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:28px 0 32px;
    max-width:700px;
  }
  .section{ margin-bottom:18px; }
  .section:last-child{ margin-bottom:0; }
  .label{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:4px;
  }
  .pattern-line{
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--magenta);
    font-weight:600;
    margin-bottom:10px;
  }
  .technique-line{
    font-size:22px;
    font-weight:600;
    margin-bottom:8px;
  }
  .formula-line{
    font-size:16px;
    color:var(--ink-soft);
    font-family:"SF Mono", "Fira Code", "Consolas", monospace;
  }
  .solution-line{
    font-size:14px;
    line-height:1.65;
    color:var(--ink);
    margin:0;
  }

  .next-area{
    display:flex;
    gap:12px;
    padding:24px 0 40px;
  }
  .next-btn{
    border:0;
    border-radius:3px;
    font:inherit;
    font-size:14px;
    font-weight:600;
    padding:11px 36px;
    cursor:pointer;
    background:var(--magenta);
    color:#fff;
    transition:background .12s ease;
  }
  .next-btn:hover{ background:var(--magenta-dk); }

  /* -------------------------------------------------------------- results */

  #results{ padding:46px 7vw 80px; }

  .score{
    font-size:40px;
    font-weight:600;
    margin:0 0 6px;
  }
  .score-sub{ font-size:15px; color:var(--ink-soft); margin:0 0 34px; }

  .review{ border-top:1px solid var(--line); max-width:1000px; }
  .row{
    border-bottom:1px solid var(--line);
    padding:18px 0 20px;
    display:grid;
    grid-template-columns:34px 1fr;
    gap:14px;
  }
  .mark{
    font-size:15px;
    line-height:1.5;
    font-weight:700;
  }
  .mark.ok{ color:#1a7f4b; }
  .mark.no{ color:var(--magenta); }
  .rq{ font-size:15px; line-height:1.55; font-weight:600; margin:0 0 8px; }
  .ra{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin:0; }
  .ra .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    border:1px solid var(--line);
    border-radius:2px;
    padding:1px 6px;
    margin-right:8px;
  }
  .note{ font-size:13px; color:var(--ink-faint); margin:8px 0 0; line-height:1.6; }

  .again{ margin-top:34px; }

  @media (max-width:820px){
    .seq-term{ font-size:24px; }
    .seq-blank{ width:44px; height:38px; font-size:22px; }
    .grid{ grid-template-columns:repeat(2,1fr); }
    .opt:nth-child(3n+1){ border-left:0; }
    .opt:nth-child(2n+1){ border-left:1px solid var(--line); }
    .modes{ grid-template-columns:1fr; }
    h1{ font-size:32px; }
  }
</style>
</head>
<body>

<!-- ============================================================ START ==== -->
<section id="start" class="screen active">
  <div class="start-inner">
    <div class="brand">Optiver</div>
    <h1>Number Logic</h1>
    <p class="lede">
      Sequence pattern-recognition questions from the Optiver assessment.
      Find the <b>missing term</b> in each sequence.
    </p>

    <div class="modes">
      <button class="mode" data-mode="timed">
        <div class="mode-title">Timed</div>
        <div class="mode-sub">15 real sequences, 2:00 each.</div>
      </button>
      <button class="mode" data-mode="all">
        <div class="mode-title">Full DB</div>
        <div class="mode-sub">All real sequences, untimed.</div>
      </button>
      <button class="mode" data-mode="photo">
        <div class="mode-title">Photo Only</div>
        <div class="mode-sub">Real assessment only, untimed.</div>
      </button>
      <button class="mode" data-mode="easy">
        <div class="mode-title">Easy</div>
        <div class="mode-sub">50 generated + real, timed.</div>
      </button>
      <button class="mode" data-mode="medium">
        <div class="mode-title">Medium</div>
        <div class="mode-sub">50 harder + real, timed.</div>
      </button>
      <button class="mode" data-mode="hard">
        <div class="mode-title">Hard</div>
        <div class="mode-sub">50 hardest + real, timed.</div>
      </button>
      <button class="mode" data-mode="extended">
        <div class="mode-title">Extended</div>
        <div class="mode-sub">15 from the full pool, timed.</div>
      </button>
    </div>

    <p class="dbline" id="dbline"></p>
  </div>
</section>

<!-- ============================================================= QUIZ ==== -->
<section id="quiz" class="screen">
  <div class="topbar">
    <div class="counter" id="counter">1 / 15</div>
    <div class="timer" id="timer">Question time left: 2:00</div>
  </div>

  <div class="stem">
    <div class="seq-row" id="seqrow"></div>
    <p class="hint" id="hint">Find the missing term.</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="actions">
    <button class="submit" id="submit" disabled>Submit</button>
  </div>

  <div class="breakdown-body">
    <div class="breakdown" id="breakdown">
      <div class="verdict" id="verdict"></div>
      <div class="card">
        <div class="section">
          <div class="label">Pattern (solving framework)</div>
          <div class="pattern-line" id="bd-pattern"></div>
        </div>
        <div class="section">
          <div class="label">Technique</div>
          <div class="technique-line" id="bd-technique"></div>
        </div>
        <div class="section">
          <div class="label">Formula</div>
          <div class="formula-line" id="bd-formula"></div>
        </div>
        <div class="section">
          <div class="label">Solution</div>
          <p class="solution-line" id="bd-solution"></p>
        </div>
      </div>
      <div class="next-area">
        <button class="next-btn" id="next-btn">Next</button>
      </div>
    </div>
  </div>
</section>

<!-- ========================================================== RESULTS ==== -->
<section id="results" class="screen">
  <p class="score" id="score"></p>
  <p class="score-sub" id="scoreSub"></p>
  <div class="review" id="review"></div>
  <div class="again">
    <button class="submit" id="restart">Back to start</button>
  </div>
</section>

<script src="questions.js"></script>
<script src="questions-extra.js"></script>
<script src="questions-difficulty.js"></script>
<script src="classifications.js"></script>
<script>
(function () {
  "use strict";

  var TIMED_COUNT   = 15;
  var SECONDS_PER_Q = 120;

  var el = function (id) { return document.getElementById(id); };

  var state = {
    mode: "timed",
    deck: [],
    index: 0,
    picked: null,
    answers: [],
    timer: null,
    left: 0
  };

  /* --------------------------------------------------------------- utils */

  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function mmss(s) {
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function show(id) {
    ["start", "quiz", "results"].forEach(function (s) {
      el(s).classList.toggle("active", s === id);
    });
  }

  function seqDisplay(q) {
    return q.sequence.map(function (t) {
      return t === "?" ? "?" : t;
    }).join(",  ");
  }

  /* --------------------------------------------------------------- start */

  var PHOTO_POOL  = QUESTIONS;
  var EASY_GEN    = QUESTIONS_EXTRA;
  var MEDIUM_GEN  = QUESTIONS_DIFFICULTY.filter(function (q) { return q.difficulty === "medium"; });
  var HARD_GEN    = QUESTIONS_DIFFICULTY.filter(function (q) { return q.difficulty === "hard"; });
  var EASY_POOL   = EASY_GEN.concat(PHOTO_POOL);
  var MEDIUM_POOL = MEDIUM_GEN.concat(PHOTO_POOL);
  var HARD_POOL   = HARD_GEN.concat(PHOTO_POOL);
  var ALL_GENERATED = QUESTIONS_EXTRA.concat(QUESTIONS_DIFFICULTY);
  var EXTENDED    = QUESTIONS.concat(ALL_GENERATED);
  var ALL_POOL    = EXTENDED;

  (function fillDbLine() {
    el("dbline").textContent =
      QUESTIONS.length + " real sequences. " +
      EASY_GEN.length + " easy, " + MEDIUM_GEN.length + " medium, " +
      HARD_GEN.length + " hard generated. " +
      "Total pool: " + ALL_POOL.length + ".";
  })();

  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.addEventListener("click", function () { begin(b.dataset.mode); });
  });

  function begin(mode) {
    state.mode = mode;
    var pool;
    switch (mode) {
      case "easy":     pool = EASY_POOL;   break;
      case "medium":   pool = MEDIUM_POOL; break;
      case "hard":     pool = HARD_POOL;   break;
      case "photo":    pool = PHOTO_POOL;  break;
      case "extended": pool = EXTENDED;    break;
      case "all":      pool = QUESTIONS;   break;
      default:         pool = QUESTIONS;   break;
    }
    state.deck = shuffle(pool);
    if (mode !== "all" && mode !== "photo") state.deck = state.deck.slice(0, TIMED_COUNT);
    state.index   = 0;
    state.answers = [];
    show("quiz");
    render();
  }

  /* ---------------------------------------------------------------- quiz */

  var breakdownShown = false;

  function render() {
    var q = state.deck[state.index];
    state.picked = null;
    breakdownShown = false;

    el("counter").textContent = (state.index + 1) + " / " + state.deck.length;

    var row = el("seqrow");
    row.innerHTML = "";
    q.sequence.forEach(function (term, i) {
      if (i > 0) {
        var sep = document.createElement("span");
        sep.className = "seq-sep";
        sep.textContent = ",";
        row.appendChild(sep);
      }
      if (term === "?") {
        var blank = document.createElement("span");
        blank.className = "seq-blank";
        blank.textContent = "?";
        row.appendChild(blank);
      } else {
        var sp = document.createElement("span");
        sp.className = "seq-term";
        sp.textContent = term;
        row.appendChild(sp);
      }
    });

    el("hint").textContent = "Find the missing term.";

    var grid = el("grid");
    grid.innerHTML = "";
    q.options.forEach(function (opt, i) {
      var b = document.createElement("button");
      b.className   = "opt";
      b.textContent = opt;
      b.addEventListener("click", function () { pick(i); });
      grid.appendChild(b);
    });
    var skip = document.createElement("button");
    skip.className   = "opt skip";
    skip.textContent = "Skip";
    skip.addEventListener("click", function () { pick("skip"); });
    grid.appendChild(skip);

    el("submit").disabled = true;
    el("submit").style.display = "";
    el("breakdown").classList.remove("visible");

    startTimer();
  }

  function pick(which) {
    if (breakdownShown) return;
    state.picked = which;
    var cells = el("grid").children;
    for (var i = 0; i < cells.length; i++) {
      var isThis = (which === "skip") ? (i === cells.length - 1) : (i === which);
      cells[i].classList.toggle("selected", isThis);
    }
    el("submit").disabled = false;
  }

  function startTimer() {
    clearInterval(state.timer);
    var t = el("timer");

    if (state.mode === "all" || state.mode === "photo") {
      t.textContent = "";
      t.classList.remove("low");
      return;
    }

    state.left = SECONDS_PER_Q;
    paintTimer();
    state.timer = setInterval(function () {
      state.left--;
      paintTimer();
      if (state.left <= 0) {
        clearInterval(state.timer);
        state.picked = null;
        advance();
      }
    }, 1000);
  }

  function paintTimer() {
    var t = el("timer");
    t.textContent = "Question time left: " + mmss(Math.max(0, state.left));
    t.classList.toggle("low", state.left <= 15);
  }

  el("submit").addEventListener("click", advance);

  function advance() {
    clearInterval(state.timer);
    var q       = state.deck[state.index];
    var picked  = state.picked;
    var correct = picked === q.answer;
    var skipped = picked === "skip" || picked === null;

    state.answers.push({
      q: q,
      picked: skipped ? null : picked,
      correct: correct
    });

    breakdownShown = true;
    el("submit").style.display = "none";

    var cells = el("grid").children;
    for (var i = 0; i < cells.length; i++) {
      if (i === q.answer) {
        cells[i].classList.add("correct-highlight");
      } else if (i === picked) {
        cells[i].classList.add("wrong-highlight");
      }
      cells[i].classList.add("locked");
    }

    el("counter").textContent = (state.index + 1) + " / " + state.deck.length + "  ·  " + q.id;

    var vd = el("verdict");
    if (skipped) {
      vd.textContent = "Skipped — correct answer: " + q.options[q.answer];
      vd.className   = "verdict no";
    } else if (correct) {
      vd.textContent = "Correct!";
      vd.className   = "verdict ok";
    } else {
      vd.textContent = "Incorrect — you picked " + q.options[picked] + ", correct: " + q.options[q.answer];
      vd.className   = "verdict no";
    }

    var cls = CLASSIFY[q.id];
    if (cls) {
      var info = PATTERN_INFO[cls.p];
      el("bd-pattern").textContent   = info.full + " → " + info.weapon;
      el("bd-technique").textContent = cls.t;
      el("bd-formula").textContent   = cls.f;
    } else {
      el("bd-pattern").textContent   = "—";
      el("bd-technique").textContent = "No classification available";
      el("bd-formula").textContent   = "";
    }
    el("bd-solution").textContent = q.note;
    el("breakdown").classList.add("visible");

    setTimeout(function () {
      el("next-btn").scrollIntoView({ block: "end" });
    }, 30);
  }

  function next() {
    if (!breakdownShown) return;
    breakdownShown = false;
    el("breakdown").classList.remove("visible");
    el("submit").style.display = "";
    state.index++;
    if (state.index >= state.deck.length) finish();
    else render();
  }

  el("next-btn").addEventListener("click", next);

  /* ------------------------------------------------------------- results */

  function finish() {
    var right = state.answers.filter(function (a) { return a.correct; }).length;
    var total = state.answers.length;

    el("score").textContent = right + " / " + total;
    var label = {
      timed:    "timed run, 15 shuffled from the real set",
      all:      "full database, untimed",
      photo:    "real assessment sequences only, untimed",
      easy:     "easy difficulty, timed",
      medium:   "medium difficulty, timed",
      hard:     "hard difficulty, timed",
      extended: "timed run, 15 shuffled from the full extended pool"
    }[state.mode];
    el("scoreSub").textContent =
      Math.round((right / total) * 100) + "% correct — " + label;

    var rev = el("review");
    rev.innerHTML = "";
    state.answers.forEach(function (a) {
      var row = document.createElement("div");
      row.className = "row";

      var mark = document.createElement("div");
      mark.className   = "mark " + (a.correct ? "ok" : "no");
      mark.textContent = a.correct ? "✓" : "✗";

      var body = document.createElement("div");

      var qp = document.createElement("p");
      qp.className   = "rq";
      qp.textContent = seqDisplay(a.q);

      var ap = document.createElement("p");
      ap.className = "ra";

      var cls = CLASSIFY[a.q.id];
      if (cls) {
        var info = PATTERN_INFO[cls.p];
        var tag = document.createElement("span");
        tag.className   = "tag";
        tag.textContent = info.full;
        ap.appendChild(tag);
        ap.appendChild(document.createTextNode(cls.t + "  ·  " + cls.f));
      }

      ap.appendChild(document.createTextNode(
        "   ·   Your answer: " + (a.picked === null ? "skipped" : a.q.options[a.picked]) +
        "   ·   Correct: " + a.q.options[a.q.answer]
      ));

      var np = document.createElement("p");
      np.className   = "note";
      np.textContent = a.q.note;

      body.appendChild(qp);
      body.appendChild(ap);
      body.appendChild(np);
      row.appendChild(mark);
      row.appendChild(body);
      rev.appendChild(row);
    });

    show("results");
    window.scrollTo(0, 0);
  }

  el("restart").addEventListener("click", function () {
    show("start");
    window.scrollTo(0, 0);
  });

  /* ----------------------------------------------------------- keyboard */

  document.addEventListener("keydown", function (e) {
    if (!el("quiz").classList.contains("active")) return;
    if (breakdownShown) {
      if (e.key === "Enter" || e.key === " " || e.key === "n" || e.key === "N") {
        e.preventDefault();
        next();
      }
      return;
    }
    var q = state.deck[state.index];
    if (e.key >= "1" && e.key <= String(q.options.length)) pick(parseInt(e.key, 10) - 1);
    else if (e.key === "s" || e.key === "S" || e.key === String(q.options.length + 1)) pick("skip");
    else if (e.key === "Enter" && state.picked !== null) advance();
  });
})();
</script>

<script>
(function(){
  document.addEventListener('keydown',function(e){
    if(e.key==='f'||e.key==='F'){
      if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(function(){});
        try{localStorage.setItem('fs-pref','1')}catch(e){}
      }
    }
  });
  document.addEventListener('fullscreenchange',function(){
    if(!document.fullscreenElement)try{localStorage.removeItem('fs-pref')}catch(e){}
  });
  try{
    if(localStorage.getItem('fs-pref')==='1'){
      var once=function(){
        document.removeEventListener('click',once,true);
        document.removeEventListener('keydown',once,true);
        if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});
      };
      document.addEventListener('click',once,true);
      document.addEventListener('keydown',once,true);
    }
  }catch(e){}
})();
</script>
