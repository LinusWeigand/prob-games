<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Likelihood List</title>
<style>
  :root{
    --ink:        #1b1b1f;
    --ink-soft:   #4a4a52;
    --ink-faint:  #8b8b93;
    --line:       #e4e4e8;
    --cell:       #f7f8f9;
    --cell-hover: #eceef0;
    --magenta:    #b3117e;
    --magenta-dk: #8e0d64;
    --green:      #1a7f4b;
    --green-bg:   #e6f5ed;
    --red-bg:     #fce8e8;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    background:#fff;
    color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---------------------------------------------------------------- start */
  #start{
    min-height:100vh;
    display:none;
    flex-direction:column;
    justify-content:center;
    padding:0 0 60px;
  }
  #start.active{ display:flex; }

  .start-inner{ padding:0 7vw; }

  .brand{
    font-size:13px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--magenta);
    font-weight:600;
    margin-bottom:14px;
  }
  h1{
    margin:0 0 14px;
    font-size:44px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .lede{
    margin:0 0 40px;
    font-size:16px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:640px;
  }
  .lede b{ font-weight:600; color:var(--ink); }

  .modes{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
    max-width:800px;
  }
  .mode{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--cell);
    padding:30px 28px 32px;
    text-align:left;
    font:inherit;
    color:inherit;
    cursor:pointer;
    transition:background .12s ease;
  }
  .mode:hover{ background:var(--cell-hover); }
  .mode-title{ font-size:20px; font-weight:600; margin-bottom:8px; }
  .mode-sub{ font-size:14px; line-height:1.55; color:var(--ink-soft); }

  .dbline{
    margin-top:26px;
    font-size:13px;
    color:var(--ink-faint);
  }

  /* ----------------------------------------------------------------- quiz */
  #quiz{ min-height:100vh; display:none; flex-direction:column; }
  #quiz.active{ display:flex; }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:22px 26px 0;
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .counter{ color:var(--ink); font-weight:400; }
  .timer.low{ color:var(--magenta); font-weight:600; }

  .stem{
    padding:28px 7vw 0;
    flex:0 0 auto;
  }
  .qtext{
    font-size:18px;
    line-height:1.55;
    font-weight:500;
    max-width:90%;
    margin:0;
    white-space:pre-wrap;
  }

  /* visual area */
  .visual-area{
    padding:20px 7vw;
    overflow-x:auto;
  }

  /* data tables */
  .data-table{
    border-collapse:collapse;
    font-size:13px;
    margin:0 auto;
  }
  .data-table th{
    background:var(--cell);
    font-weight:600;
    padding:8px 14px;
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .data-table td{
    padding:6px 14px;
    border:1px solid var(--line);
    text-align:center;
    white-space:nowrap;
  }
  .data-table tr:nth-child(even) td{ background:#fafafa; }

  /* charts */
  .chart-container{
    display:flex;
    justify-content:center;
  }
  .chart-container svg{
    max-width:min(600px, 100%);
    height:auto;
  }

  /* question images */
  .visual-img{
    display:block;
    max-width:100%;
    height:auto;
    margin:0 auto;
    border-radius:4px;
  }

  /* ranking area */
  .rank-label{
    padding:10px 7vw 0;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:600;
  }

  .rank-area{
    padding:8px 7vw 0;
    max-width:800px;
  }

  .rank-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--cell);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 18px;
    margin-bottom:8px;
    cursor:grab;
    user-select:none;
    transition:background .1s ease, box-shadow .15s ease, transform .15s ease;
    font-size:15px;
    line-height:1.5;
  }
  .rank-item:active{ cursor:grabbing; }
  .rank-item.dragging{
    opacity:.5;
    background:var(--cell-hover);
  }
  .rank-item.drag-over{
    box-shadow:0 -3px 0 0 var(--magenta);
  }

  .rank-handle{
    color:var(--ink-faint);
    font-size:18px;
    flex-shrink:0;
    cursor:grab;
  }

  .rank-num{
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--magenta);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .rank-text{ flex:1; }

  .rank-arrows{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex-shrink:0;
  }
  .rank-arrow{
    background:none;
    border:1px solid var(--line);
    border-radius:3px;
    width:28px;
    height:22px;
    cursor:pointer;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .1s ease;
  }
  .rank-arrow:hover{ background:var(--cell-hover); }

  /* correct/wrong highlights */
  .rank-item.correct{
    background:var(--green-bg);
    border-color:var(--green);
  }
  .rank-item.wrong{
    background:var(--red-bg);
    border-color:var(--magenta);
  }
  .rank-item.locked{
    cursor:default;
    pointer-events:none;
  }

  .actions{
    display:flex;
    justify-content:flex-end;
    padding:18px 26px 30px;
    gap:12px;
  }
  .submit{
    background:var(--magenta);
    color:#fff;
    border:0;
    border-radius:3px;
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:9px 20px;
    cursor:pointer;
    transition:background .12s ease, opacity .12s ease;
  }
  .submit:hover{ background:var(--magenta-dk); }
  .skip-btn{
    background:var(--cell);
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:3px;
    font:inherit;
    font-size:13px;
    font-weight:500;
    padding:9px 20px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .skip-btn:hover{ background:var(--cell-hover); }

  /* breakdown */
  .breakdown-body{ padding:0 7vw; }

  .breakdown{ display:none; }
  .breakdown.visible{ display:block; }

  .verdict{
    font-size:20px;
    font-weight:700;
    padding:18px 0 14px;
  }
  .verdict.ok{ color:var(--green); }
  .verdict.no{ color:var(--magenta); }
  .verdict.skip-v{ color:var(--ink-faint); }

  .breakdown-card{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:22px 0 26px;
    max-width:700px;
  }

  .bd-section{ margin-bottom:16px; }
  .bd-section:last-child{ margin-bottom:0; }
  .bd-label{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:4px;
  }
  .bd-category{
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--magenta);
    font-weight:600;
    margin-bottom:6px;
  }
  .bd-technique{
    font-size:18px;
    font-weight:600;
    margin-bottom:6px;
  }
  .bd-solution{
    font-size:14px;
    line-height:1.65;
    color:var(--ink);
    margin:0;
    white-space:pre-wrap;
  }
  .bd-correct-order{
    font-size:14px;
    line-height:1.65;
    color:var(--ink);
  }
  .bd-correct-order ol{
    margin:4px 0 0;
    padding-left:20px;
  }
  .bd-correct-order li{ margin-bottom:4px; }

  .bd-next{
    border:0;
    border-radius:3px;
    font:inherit;
    font-size:14px;
    font-weight:600;
    padding:11px 36px;
    cursor:pointer;
    background:var(--magenta);
    color:#fff;
    transition:background .12s ease;
    margin-top:18px;
  }
  .bd-next:hover{ background:var(--magenta-dk); }

  /* ---------------------------------------------------------- results */
  #results{ padding:46px 7vw 80px; }

  .score{
    font-size:40px;
    font-weight:600;
    margin:0 0 6px;
  }
  .score-sub{ font-size:15px; color:var(--ink-soft); margin:0 0 34px; }

  .review{ border-top:1px solid var(--line); max-width:1000px; }
  .rev-row{
    border-bottom:1px solid var(--line);
    padding:18px 0 20px;
    display:grid;
    grid-template-columns:34px 1fr;
    gap:14px;
  }
  .mark{
    font-size:15px;
    line-height:1.5;
    font-weight:700;
  }
  .mark.ok{ color:var(--green); }
  .mark.no{ color:var(--magenta); }
  .rq{ font-size:15px; line-height:1.55; font-weight:600; margin:0 0 6px; white-space:pre-wrap; }
  .ra{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin:0; }
  .note{ font-size:13px; color:var(--ink-faint); margin:6px 0 0; line-height:1.6; white-space:pre-wrap; }

  .again{ margin-top:34px; }

  @media (max-width:820px){
    .qtext{ max-width:100%; font-size:16px; }
    .modes{ grid-template-columns:1fr; }
    h1{ font-size:32px; }
    .rank-area{ max-width:100%; }
    .data-table{ font-size:11px; }
    .data-table th, .data-table td{ padding:4px 8px; }
  }
</style>
</head>
<body>

<!-- ============================================================ START ==== -->
<section id="start" class="screen active">
  <div class="start-inner">
    <div class="brand">Optiver</div>
    <h1>Likelihood List</h1>
    <p class="lede">
      Rank three statements from <b>most likely</b> to <b>least likely</b>.
      Many questions include a table, chart, or diagram &mdash; use the data
      to estimate relative probabilities.
    </p>

    <div class="modes">
      <button class="mode" data-mode="original">
        <div class="mode-title">Original</div>
        <div class="mode-sub">
          The 13 assessment questions, shuffled.<br>
          1:30 per question.
        </div>
      </button>
      <button class="mode" data-mode="same-data">
        <div class="mode-title">+ Same Data</div>
        <div class="mode-sub">
          Original + 25 new questions on the same tables.<br>
          Max 15 per session. 1:30 each.
        </div>
      </button>
      <button class="mode" data-mode="new-examples">
        <div class="mode-title">+ New Examples</div>
        <div class="mode-sub">
          Original + 25 questions with new tables, charts &amp; graphs.<br>
          Max 15 per session. 1:30 each.
        </div>
      </button>
    </div>

    <p class="dbline" id="dbline"></p>
  </div>
</section>

<!-- ============================================================= QUIZ ==== -->
<section id="quiz" class="screen">
  <div class="topbar">
    <div class="counter" id="counter">1 / 13</div>
    <div class="timer" id="timer">1:30</div>
  </div>

  <div class="stem">
    <p class="qtext" id="qtext"></p>
  </div>

  <div class="visual-area" id="visual-area"></div>

  <div class="rank-label">MOST LIKELY</div>
  <div class="rank-area" id="rank-area"></div>
  <div class="rank-label" style="color:var(--ink-faint);opacity:.6;padding-bottom:4px">LEAST LIKELY</div>

  <div class="actions" id="quiz-actions">
    <button class="skip-btn" id="skip-btn">Skip</button>
    <button class="submit" id="submit-btn">Submit</button>
  </div>

  <div class="breakdown-body">
    <div class="breakdown" id="breakdown">
      <div class="verdict" id="verdict"></div>
      <div class="breakdown-card">
        <div class="bd-section">
          <div class="bd-label">Correct order</div>
          <div class="bd-correct-order" id="bd-correct-order"></div>
        </div>
        <div class="bd-section">
          <div class="bd-label">Category</div>
          <div class="bd-category" id="bd-category"></div>
        </div>
        <div class="bd-section">
          <div class="bd-label">Technique</div>
          <div class="bd-technique" id="bd-technique"></div>
        </div>
        <div class="bd-section">
          <div class="bd-label">Solution</div>
          <p class="bd-solution" id="bd-solution"></p>
        </div>
      </div>
      <button class="bd-next" id="bd-next">Next</button>
    </div>
  </div>
</section>

<!-- ========================================================== RESULTS ==== -->
<section id="results" class="screen">
  <p class="score" id="score"></p>
  <p class="score-sub" id="scoreSub"></p>
  <div class="review" id="review"></div>
  <div class="again">
    <button class="submit" id="restart">Back to start</button>
  </div>
</section>

<script src="questions.js"></script>
<script src="questions-extra.js"></script>
<script>
(function () {
  "use strict";

  var SECONDS_PER_Q = 90;

  var el = function (id) { return document.getElementById(id); };

  var state = {
    mode: "timed",
    deck: [],
    index: 0,
    order: [],
    answers: [],
    timer: null,
    left: 0,
    locked: false
  };

  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function mmss(s) {
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function show(id) {
    ["start", "quiz", "results"].forEach(function (s) {
      el(s).classList.toggle("active", s === id);
    });
  }

  // ----------------------------------------------------------- start
  el("dbline").textContent = QUESTIONS.length + " original + " + QUESTIONS_A.length + " same-data + " + QUESTIONS_B.length + " new-example questions.";

  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.addEventListener("click", function () { begin(b.dataset.mode); });
  });

  function begin(mode) {
    state.mode = "timed";
    var pool;
    if (mode === "original") {
      pool = QUESTIONS;
    } else if (mode === "same-data") {
      pool = QUESTIONS.concat(QUESTIONS_A);
    } else {
      pool = QUESTIONS.concat(QUESTIONS_B);
    }
    state.deck = shuffle(pool).slice(0, 15);
    state.index = 0;
    state.answers = [];
    show("quiz");
    render();
  }

  // ----------------------------------------------------------- render
  function render() {
    var q = state.deck[state.index];
    state.locked = false;
    state.order = shuffle([0, 1, 2]);

    el("counter").textContent = (state.index + 1) + " / " + state.deck.length;
    el("qtext").textContent = q.text;

    renderVisual(q);
    renderRankItems(q);

    el("breakdown").classList.remove("visible");
    el("quiz-actions").style.display = "";

    startTimer();
    window.scrollTo(0, 0);
  }

  // ----------------------------------------------------------- visuals
  function renderVisual(q) {
    var area = el("visual-area");
    area.innerHTML = "";

    if (q.visualType === "table" && q.visualData) {
      area.appendChild(buildTable(q.visualData));
    } else if (q.visualType === "image" && q.imageSrc) {
      var img = document.createElement("img");
      img.className = "visual-img";
      img.src = "data/photos/cropped/" + q.imageSrc;
      img.alt = "Question visual";
      area.appendChild(img);
    } else if (q.visualType === "directed-graph" && q.graphData) {
      var div = document.createElement("div");
      div.className = "chart-container";
      div.appendChild(renderDirectedGraph(q.graphData));
      area.appendChild(div);
    } else if (q.visualType === "line-chart" && q.chartData) {
      var div2 = document.createElement("div");
      div2.className = "chart-container";
      div2.appendChild(renderLineChart(q.chartData));
      area.appendChild(div2);
    } else if (q.visualType === "scatter-plot" && q.chartData) {
      var div3 = document.createElement("div");
      div3.className = "chart-container";
      div3.appendChild(renderScatterPlot(q.chartData));
      area.appendChild(div3);
    } else if (q.visualType === "bar-chart" && q.chartData) {
      var div4 = document.createElement("div");
      div4.className = "chart-container";
      div4.appendChild(renderBarChart(q.chartData));
      area.appendChild(div4);
    }
  }

  function buildTable(d) {
    var t = document.createElement("table");
    t.className = "data-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    d.headers.forEach(function (h) {
      var th = document.createElement("th");
      th.textContent = h;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    t.appendChild(thead);

    var tbody = document.createElement("tbody");
    d.rows.forEach(function (row) {
      var tr = document.createElement("tr");
      row.forEach(function (cell) {
        var td = document.createElement("td");
        td.textContent = cell;
        if (/^[A-F?]$/.test(cell) || /^M[₁₂₃]$/.test(cell)) {
          td.style.fontWeight = "700";
          td.style.color = "var(--magenta)";
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    return t;
  }

  // ----------------------------------------------------------- SVG charts
  var NS = "http://www.w3.org/2000/svg";
  function svgEl(tag) { return document.createElementNS(NS, tag); }

  function renderDirectedGraph(gd) {
    var xs = gd.nodes.map(function(n){return n.x;});
    var ys = gd.nodes.map(function(n){return n.y;});
    var pad = 50;
    var vw = Math.max.apply(null,xs) + pad * 2;
    var vh = Math.max.apply(null,ys) + pad * 2;
    var ox = pad, oy = pad;

    var svg = svgEl("svg");
    svg.setAttribute("viewBox", "0 0 " + vw + " " + vh);
    svg.setAttribute("width", Math.min(vw, 400));

    var defs = svgEl("defs");
    var mk = svgEl("marker");
    mk.setAttribute("id","ah"); mk.setAttribute("markerWidth","10");
    mk.setAttribute("markerHeight","7"); mk.setAttribute("refX","10");
    mk.setAttribute("refY","3.5"); mk.setAttribute("orient","auto");
    var pg = svgEl("polygon");
    pg.setAttribute("points","0 0,10 3.5,0 7");
    pg.setAttribute("fill","var(--ink-soft)");
    mk.appendChild(pg); defs.appendChild(mk); svg.appendChild(defs);

    var nMap = {};
    gd.nodes.forEach(function(n){ nMap[n.id] = {x:n.x+ox, y:n.y+oy}; });

    var R = 22;
    gd.edges.forEach(function(e){
      var f = nMap[e.from], t = nMap[e.to];
      var dx = t.x-f.x, dy = t.y-f.y;
      var d = Math.sqrt(dx*dx+dy*dy);
      var nx = dx/d, ny = dy/d;
      var ln = svgEl("line");
      ln.setAttribute("x1", f.x+nx*R); ln.setAttribute("y1", f.y+ny*R);
      ln.setAttribute("x2", t.x-nx*(R+8)); ln.setAttribute("y2", t.y-ny*(R+8));
      ln.setAttribute("stroke","var(--ink-soft)");
      ln.setAttribute("stroke-width","1.5");
      ln.setAttribute("marker-end","url(#ah)");
      svg.appendChild(ln);
    });

    gd.nodes.forEach(function(n){
      var cx = n.x+ox, cy = n.y+oy;
      var c = svgEl("circle");
      c.setAttribute("cx",cx); c.setAttribute("cy",cy);
      c.setAttribute("r",R);
      c.setAttribute("fill","#fff"); c.setAttribute("stroke","var(--magenta)");
      c.setAttribute("stroke-width","2");
      svg.appendChild(c);
      var txt = svgEl("text");
      txt.setAttribute("x",cx); txt.setAttribute("y",cy+5);
      txt.setAttribute("text-anchor","middle");
      txt.setAttribute("font-size","14"); txt.setAttribute("font-weight","600");
      txt.setAttribute("fill","var(--ink)");
      txt.textContent = n.id;
      svg.appendChild(txt);
    });

    return svg;
  }

  function chartScales(cd, ml, mt, pw, ph) {
    var xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
    var src = cd.series || cd.groups;
    src.forEach(function(s) {
      (s.data || s.points).forEach(function(p) {
        if (p[0] < xMin) xMin = p[0]; if (p[0] > xMax) xMax = p[0];
        if (p[1] < yMin) yMin = p[1]; if (p[1] > yMax) yMax = p[1];
      });
    });
    if (cd.xRange) { xMin = cd.xRange[0]; xMax = cd.xRange[1]; }
    if (cd.yRange) { yMin = cd.yRange[0]; yMax = cd.yRange[1]; }
    if (!cd.xRange) { var xPad = (xMax - xMin) * 0.08 || 1; xMin -= xPad; xMax += xPad; }
    if (!cd.yRange) { var yPad = (yMax - yMin) * 0.08 || 1; yMin -= yPad; yMax += yPad; }
    return {
      xMin:xMin, xMax:xMax, yMin:yMin, yMax:yMax,
      sx: function(v){ return ml + (v - xMin)/(xMax - xMin) * pw; },
      sy: function(v){ return mt + ph - (v - yMin)/(yMax - yMin) * ph; }
    };
  }

  function drawAxes(svg, sc, ml, mt, pw, ph, H, cd) {
    var ySteps = 5, yStep = (sc.yMax - sc.yMin) / ySteps;
    for (var i = 0; i <= ySteps; i++) {
      var yv = sc.yMin + i * yStep, gy = sc.sy(yv);
      var gl = svgEl("line");
      gl.setAttribute("x1",ml); gl.setAttribute("x2",ml+pw);
      gl.setAttribute("y1",gy); gl.setAttribute("y2",gy);
      gl.setAttribute("stroke","#e4e4e8"); gl.setAttribute("stroke-width","1");
      svg.appendChild(gl);
      var tl = svgEl("text");
      tl.setAttribute("x",ml-8); tl.setAttribute("y",gy+4);
      tl.setAttribute("text-anchor","end");
      tl.setAttribute("font-size","10"); tl.setAttribute("fill","var(--ink-faint)");
      tl.textContent = Math.round(yv*10)/10;
      svg.appendChild(tl);
    }
    var xSteps = Math.min(10, Math.round(sc.xMax - sc.xMin));
    if (xSteps < 2) xSteps = 5;
    var xStep = (sc.xMax - sc.xMin) / xSteps;
    for (var j = 0; j <= xSteps; j++) {
      var xv = sc.xMin + j * xStep, gx = sc.sx(xv);
      var xt = svgEl("text");
      xt.setAttribute("x",gx); xt.setAttribute("y",mt+ph+20);
      xt.setAttribute("text-anchor","middle");
      xt.setAttribute("font-size","10"); xt.setAttribute("fill","var(--ink-faint)");
      xt.textContent = Math.round(xv*10)/10;
      svg.appendChild(xt);
    }
    var xa = svgEl("line");
    xa.setAttribute("x1",ml); xa.setAttribute("x2",ml+pw);
    xa.setAttribute("y1",mt+ph); xa.setAttribute("y2",mt+ph);
    xa.setAttribute("stroke","var(--ink-soft)"); xa.setAttribute("stroke-width","1");
    svg.appendChild(xa);
    var ya = svgEl("line");
    ya.setAttribute("x1",ml); ya.setAttribute("x2",ml);
    ya.setAttribute("y1",mt); ya.setAttribute("y2",mt+ph);
    ya.setAttribute("stroke","var(--ink-soft)"); ya.setAttribute("stroke-width","1");
    svg.appendChild(ya);
    var xlbl = svgEl("text");
    xlbl.setAttribute("x",ml+pw/2); xlbl.setAttribute("y",H-5);
    xlbl.setAttribute("text-anchor","middle");
    xlbl.setAttribute("font-size","12"); xlbl.setAttribute("fill","var(--ink-soft)");
    xlbl.textContent = cd.xLabel;
    svg.appendChild(xlbl);
    var ylbl = svgEl("text");
    ylbl.setAttribute("x",14); ylbl.setAttribute("y",mt+ph/2);
    ylbl.setAttribute("text-anchor","middle");
    ylbl.setAttribute("font-size","12"); ylbl.setAttribute("fill","var(--ink-soft)");
    ylbl.setAttribute("transform","rotate(-90,14,"+(mt+ph/2)+")");
    ylbl.textContent = cd.yLabel;
    svg.appendChild(ylbl);
  }

  function drawLegend(svg, items, ml, mt, pw) {
    items.forEach(function(it, i) {
      var lx = ml + pw + 15, ly = mt + 5 + i * 20;
      var shape = svgEl(it.circle ? "circle" : "rect");
      if (it.circle) {
        shape.setAttribute("cx",lx+6); shape.setAttribute("cy",ly+6);
        shape.setAttribute("r","5");
      } else {
        shape.setAttribute("x",lx); shape.setAttribute("y",ly);
        shape.setAttribute("width","12"); shape.setAttribute("height","12");
        shape.setAttribute("rx","2");
      }
      shape.setAttribute("fill",it.color);
      svg.appendChild(shape);
      var lt = svgEl("text");
      lt.setAttribute("x",lx+17); lt.setAttribute("y",ly+10);
      lt.setAttribute("font-size","10"); lt.setAttribute("fill","var(--ink)");
      lt.textContent = it.name;
      svg.appendChild(lt);
    });
  }

  function renderLineChart(cd) {
    var W=600, H=380, ml=55, mr=120, mt=30, mb=45;
    var pw=W-ml-mr, ph=H-mt-mb;
    var svg = svgEl("svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);

    var sc = chartScales(cd, ml, mt, pw, ph);
    drawAxes(svg, sc, ml, mt, pw, ph, H, cd);

    cd.series.forEach(function(s) {
      var pts = s.data.map(function(p){ return sc.sx(p[0])+","+sc.sy(p[1]); }).join(" ");
      var pl = svgEl("polyline");
      pl.setAttribute("points",pts);
      pl.setAttribute("fill","none");
      pl.setAttribute("stroke",s.color);
      pl.setAttribute("stroke-width","2");
      svg.appendChild(pl);
      s.data.forEach(function(p) {
        var dot = svgEl("circle");
        dot.setAttribute("cx",sc.sx(p[0])); dot.setAttribute("cy",sc.sy(p[1]));
        dot.setAttribute("r","2.5"); dot.setAttribute("fill",s.color);
        svg.appendChild(dot);
      });
    });

    drawLegend(svg, cd.series.map(function(s){ return {name:s.name,color:s.color}; }), ml, mt, pw);
    return svg;
  }

  function renderScatterPlot(cd) {
    var W=600, H=380, ml=55, mr=120, mt=30, mb=45;
    var pw=W-ml-mr, ph=H-mt-mb;
    var svg = svgEl("svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);

    var sc = chartScales(cd, ml, mt, pw, ph);
    drawAxes(svg, sc, ml, mt, pw, ph, H, cd);

    cd.groups.forEach(function(g) {
      g.points.forEach(function(p) {
        var dot = svgEl("circle");
        dot.setAttribute("cx",sc.sx(p[0])); dot.setAttribute("cy",sc.sy(p[1]));
        dot.setAttribute("r","5"); dot.setAttribute("fill",g.color);
        dot.setAttribute("opacity","0.75");
        svg.appendChild(dot);
      });
    });

    drawLegend(svg, cd.groups.map(function(g){ return {name:g.name,color:g.color,circle:true}; }), ml, mt, pw);
    return svg;
  }

  function renderBarChart(cd) {
    var W=600, H=380, ml=55, mr=120, mt=30, mb=55;
    var pw=W-ml-mr, ph=H-mt-mb;
    var svg = svgEl("svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);

    var yMax = 0;
    cd.series.forEach(function(s){ s.values.forEach(function(v){ if(v>yMax) yMax=v; }); });
    yMax = Math.ceil(yMax * 1.15);

    var sy = function(v){ return mt + ph - (v/yMax)*ph; };

    var ySteps = 5, yStep = yMax / ySteps;
    for (var i=0; i<=ySteps; i++) {
      var yv = i*yStep, gy = sy(yv);
      var gl = svgEl("line");
      gl.setAttribute("x1",ml); gl.setAttribute("x2",ml+pw);
      gl.setAttribute("y1",gy); gl.setAttribute("y2",gy);
      gl.setAttribute("stroke","#e4e4e8"); gl.setAttribute("stroke-width","1");
      svg.appendChild(gl);
      var tl = svgEl("text");
      tl.setAttribute("x",ml-8); tl.setAttribute("y",gy+4);
      tl.setAttribute("text-anchor","end");
      tl.setAttribute("font-size","10"); tl.setAttribute("fill","var(--ink-faint)");
      tl.textContent = Math.round(yv);
      svg.appendChild(tl);
    }

    var xa = svgEl("line");
    xa.setAttribute("x1",ml); xa.setAttribute("x2",ml+pw);
    xa.setAttribute("y1",mt+ph); xa.setAttribute("y2",mt+ph);
    xa.setAttribute("stroke","var(--ink-soft)"); xa.setAttribute("stroke-width","1");
    svg.appendChild(xa);

    var nCats = cd.categories.length, nSer = cd.series.length;
    var catW = pw / nCats;
    var barW = catW * 0.7 / nSer;

    cd.categories.forEach(function(cat, ci) {
      var cx = ml + ci*catW + catW/2;
      var cl = svgEl("text");
      cl.setAttribute("x",cx); cl.setAttribute("y",mt+ph+18);
      cl.setAttribute("text-anchor","middle");
      cl.setAttribute("font-size","9"); cl.setAttribute("fill","var(--ink-soft)");
      cl.textContent = cat;
      svg.appendChild(cl);

      cd.series.forEach(function(s, si) {
        var bx = cx - (nSer*barW)/2 + si*barW;
        var bh = (s.values[ci]/yMax)*ph;
        var rect = svgEl("rect");
        rect.setAttribute("x",bx); rect.setAttribute("y",mt+ph-bh);
        rect.setAttribute("width",Math.max(barW-2,2)); rect.setAttribute("height",bh);
        rect.setAttribute("fill",s.color); rect.setAttribute("rx","2");
        svg.appendChild(rect);
      });
    });

    var xlbl = svgEl("text");
    xlbl.setAttribute("x",ml+pw/2); xlbl.setAttribute("y",H-5);
    xlbl.setAttribute("text-anchor","middle");
    xlbl.setAttribute("font-size","12"); xlbl.setAttribute("fill","var(--ink-soft)");
    xlbl.textContent = cd.xLabel;
    svg.appendChild(xlbl);
    var ylbl = svgEl("text");
    ylbl.setAttribute("x",14); ylbl.setAttribute("y",mt+ph/2);
    ylbl.setAttribute("text-anchor","middle");
    ylbl.setAttribute("font-size","12"); ylbl.setAttribute("fill","var(--ink-soft)");
    ylbl.setAttribute("transform","rotate(-90,14,"+(mt+ph/2)+")");
    ylbl.textContent = cd.yLabel;
    svg.appendChild(ylbl);

    drawLegend(svg, cd.series.map(function(s){ return {name:s.name,color:s.color}; }), ml, mt, pw);
    return svg;
  }

  // ----------------------------------------------------------- rank items
  function renderRankItems(q) {
    var area = el("rank-area");
    area.innerHTML = "";

    state.order.forEach(function (origIdx, pos) {
      var item = document.createElement("div");
      item.className = "rank-item";
      item.draggable = true;
      item.dataset.pos = pos;

      var num = document.createElement("div");
      num.className = "rank-num";
      num.textContent = pos + 1;

      var handle = document.createElement("div");
      handle.className = "rank-handle";
      handle.textContent = "≡";

      var text = document.createElement("div");
      text.className = "rank-text";
      text.textContent = q.statements[origIdx];

      var arrows = document.createElement("div");
      arrows.className = "rank-arrows";
      var up = document.createElement("button");
      up.className = "rank-arrow";
      up.textContent = "▲";
      up.addEventListener("click", function (e) { e.stopPropagation(); moveItem(parseInt(item.dataset.pos), -1); });
      var down = document.createElement("button");
      down.className = "rank-arrow";
      down.textContent = "▼";
      down.addEventListener("click", function (e) { e.stopPropagation(); moveItem(parseInt(item.dataset.pos), 1); });
      arrows.appendChild(up);
      arrows.appendChild(down);

      item.appendChild(handle);
      item.appendChild(num);
      item.appendChild(text);
      item.appendChild(arrows);
      area.appendChild(item);

      // drag events
      item.addEventListener("dragstart", function (e) {
        if (state.locked) { e.preventDefault(); return; }
        item.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", item.dataset.pos);
      });
      item.addEventListener("dragend", function () {
        item.classList.remove("dragging");
        clearDragOver();
      });
      item.addEventListener("dragover", function (e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        clearDragOver();
        item.classList.add("drag-over");
      });
      item.addEventListener("drop", function (e) {
        e.preventDefault();
        clearDragOver();
        var fromPos = parseInt(e.dataTransfer.getData("text/plain"));
        var toPos = parseInt(item.dataset.pos);
        if (fromPos !== toPos) {
          swapItems(fromPos, toPos);
        }
      });
    });
  }

  function clearDragOver() {
    Array.prototype.forEach.call(document.querySelectorAll(".rank-item"), function (el) {
      el.classList.remove("drag-over");
    });
  }

  function moveItem(pos, dir) {
    if (state.locked) return;
    var newPos = pos + dir;
    if (newPos < 0 || newPos > 2) return;
    swapItems(pos, newPos);
  }

  function swapItems(fromPos, toPos) {
    var tmp = state.order[fromPos];
    state.order[fromPos] = state.order[toPos];
    state.order[toPos] = tmp;
    updateRankDisplay();
  }

  function updateRankDisplay() {
    var q = state.deck[state.index];
    var items = el("rank-area").children;
    for (var i = 0; i < items.length; i++) {
      items[i].dataset.pos = i;
      items[i].querySelector(".rank-num").textContent = i + 1;
      items[i].querySelector(".rank-text").textContent = q.statements[state.order[i]];
    }
  }

  // ----------------------------------------------------------- timer
  function startTimer() {
    clearInterval(state.timer);
    var t = el("timer");

    if (state.mode === "untimed") {
      t.textContent = "";
      t.classList.remove("low");
      return;
    }

    state.left = SECONDS_PER_Q;
    paintTimer();
    state.timer = setInterval(function () {
      state.left--;
      paintTimer();
      if (state.left <= 0) {
        clearInterval(state.timer);
        submitAnswer(true);
      }
    }, 1000);
  }

  function paintTimer() {
    var t = el("timer");
    t.textContent = mmss(Math.max(0, state.left));
    t.classList.toggle("low", state.left <= 15);
  }

  // ----------------------------------------------------------- submit
  el("submit-btn").addEventListener("click", function () { submitAnswer(false); });
  el("skip-btn").addEventListener("click", function () { submitAnswer(true); });

  function submitAnswer(skipped) {
    if (state.locked) return;
    state.locked = true;
    clearInterval(state.timer);

    var q = state.deck[state.index];
    var correct = !skipped && state.order[0] === 0 && state.order[1] === 1 && state.order[2] === 2;

    state.answers.push({
      q: q,
      userOrder: state.order.slice(),
      correct: correct,
      skipped: skipped
    });

    el("quiz-actions").style.display = "none";

    // highlight items
    var items = el("rank-area").children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.add("locked");
      if (!skipped) {
        items[i].classList.add(state.order[i] === i ? "correct" : "wrong");
      }
    }

    // show breakdown
    var verdict = el("verdict");
    if (skipped) {
      verdict.textContent = "Skipped";
      verdict.className = "verdict skip-v";
    } else if (correct) {
      verdict.textContent = "Correct!";
      verdict.className = "verdict ok";
    } else {
      verdict.textContent = "Incorrect";
      verdict.className = "verdict no";
    }

    var ol = document.createElement("ol");
    q.statements.forEach(function (s) {
      var li = document.createElement("li");
      li.textContent = s;
      ol.appendChild(li);
    });
    var correctDiv = el("bd-correct-order");
    correctDiv.innerHTML = "";
    correctDiv.appendChild(ol);

    el("bd-category").textContent = q.category;
    el("bd-technique").textContent = q.technique;
    el("bd-solution").textContent = q.note;

    el("breakdown").classList.add("visible");
  }

  el("bd-next").addEventListener("click", nextQuestion);

  function nextQuestion() {
    state.index++;
    if (state.index >= state.deck.length) finish();
    else render();
  }

  // keyboard
  document.addEventListener("keydown", function (e) {
    if (!el("quiz").classList.contains("active")) return;
    if (state.locked) {
      if (e.key === "Enter" || e.key === " " || e.key === "n" || e.key === "N") {
        e.preventDefault();
        nextQuestion();
      }
    }
  });

  // ----------------------------------------------------------- results
  function finish() {
    var right = state.answers.filter(function (a) { return a.correct; }).length;
    var total = state.answers.length;

    el("score").textContent = right + " / " + total;
    var label = state.mode === "timed" ? "timed, 1:30 per question" : "untimed";
    el("scoreSub").textContent = Math.round((right / total) * 100) + "% correct — " + label;

    var rev = el("review");
    rev.innerHTML = "";
    state.answers.forEach(function (a) {
      var row = document.createElement("div");
      row.className = "rev-row";

      var mark = document.createElement("div");
      mark.className = "mark " + (a.correct ? "ok" : "no");
      mark.textContent = a.correct ? "✓" : "✗";

      var body = document.createElement("div");

      var qp = document.createElement("p");
      qp.className = "rq";
      qp.textContent = a.q.text.substring(0, 120) + (a.q.text.length > 120 ? "..." : "");

      var ap = document.createElement("p");
      ap.className = "ra";
      if (a.skipped) {
        ap.textContent = "Skipped";
      } else {
        ap.textContent = "Your order: " +
          a.userOrder.map(function (idx) { return (idx + 1) + ". " + a.q.statements[idx]; }).join("  |  ");
      }

      var np = document.createElement("p");
      np.className = "note";
      np.textContent = "Correct: " + a.q.statements.map(function (s, i) { return (i + 1) + ". " + s; }).join("  |  ");

      body.appendChild(qp);
      body.appendChild(ap);
      body.appendChild(np);
      row.appendChild(mark);
      row.appendChild(body);
      rev.appendChild(row);
    });

    show("results");
    window.scrollTo(0, 0);
  }

  el("restart").addEventListener("click", function () {
    show("start");
    window.scrollTo(0, 0);
  });

})();
</script>
</body>
</html>
